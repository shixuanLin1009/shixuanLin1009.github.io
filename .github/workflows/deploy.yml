name: Deploy site

# Every push to main — from `npm run publish`, the online CMS or a manual
# commit — rebuilds the site *and* the two resume PDFs from the same content.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: typst-community/setup-typst@v5
        with:
          typst-version: '0.15.1'
          cache-dependency-path: resume/template.typ

      # Noto Serif TC for the Chinese resume (downloaded + checksum-verified by scripts/fetch-fonts.ts)
      - uses: actions/cache@v6
        with:
          path: resume/fonts
          key: resume-fonts-${{ hashFiles('scripts/fetch-fonts.ts') }}

      - run: npm ci

      # astro build → Typst PDFs from dist/cv/*.json → Pagefind index
      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
