en:
  org: NCKU Freshman Orientation Camp (13th)
  role: Vice Convener
  type: leadership
  location: Tainan, Taiwan
  start: 2023-03-01
  end: 2023-09-30
  bullets:
    - Co-led a 300-person organizing team over six months to plan a three-day program of talks, exhibitions and workshops for 3,000 incoming students.
    - When Typhoon Haikui struck days before the event, condensed the three-day program into one day within five days while coordinating closely with the university to keep every participant safe.
  showOnResume: false
  order: 4
zh-TW:
  org: 成功大學 第13屆成功登大人新鮮人成長營
  role: 副召集人
  location: 台灣 台南
  bullets:
    - 與搭檔在半年間組建 300 人的行政團隊，策劃為期三天、涵蓋講座、展覽與工作坊的活動，幫助 3,000 名新生接軌大學生活。
    - 活動前夕強烈颱風海葵來襲，在五天內將三天的活動濃縮為一天，與校方密切聯繫並確保所有參與者安全，最終順利舉行。
