en:
  org: Engineering Component Recommendation System — NSTC Project
  role: Software Engineer
  type: work
  location: Tainan, Taiwan
  start: 2024-12-01
  end: 2025-10-31
  bullets:
    - Developed a recommendation system for engineering components under the NSTC project led by Prof. Chin-Feng Lai, focusing on high-frequency and low-frequency magnetic component training.
    - Designed and implemented a vector/linear routing algorithm and Python data-processing scripts that suggest optimal components from multiple engineering parameters, improving selection efficiency for researchers and engineers.
    - Collaborated with a multidisciplinary team to integrate the system into the training platform, ensuring usability for educational and research purposes.
