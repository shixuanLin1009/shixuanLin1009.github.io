title: "VolleyCC: Volleyball Comprehension Captioning System Based on Vision-Language Model and Spatial-Temporal Integration"
authors:
  - Shixuan Lin
  - et al.
venue: International Conference on Robotics, Control and Vision Engineering
venueShort: RCVE
year: 2026
status: submitted
type: conference
abstract: >-
  A hierarchical video comprehension framework that combines dedicated vision
  models (RT-DETR, X3D) with vision-language models to generate fine-grained,
  timestamped narratives from volleyball broadcasts, improving action
  correctness by 27.8% and temporal consistency by 14.6% over baseline VLMs.
